name: Daily finance brief

on:
  schedule:
    # Beijing 05:17, 06:43, 07:31 prewarm; 08:00 target and 08:17 retry. GitHub scheduling is best effort.
    # 2026-10-28 08:21 CST: recovery trigger for missing scheduled run; no workflow behavior change.
    - cron: "17 21 * * *"
    - cron: "43 22 * * *"
    - cron: "31 23 * * *"
    - cron: "17 0 * * *"
    - cron: "0 0 * * *"
    - cron: "7 0 * * *"
    - cron: "37 0 * * *"
    - cron: "17 1 * * *"
    - cron: "17 4 * * *"
  push:
    branches: [main]
    paths:
      - scripts/daily_delivery.py
      - .github/workflows/daily-brief.yml
  workflow_dispatch:
    inputs:
      send_notification:
        description: "Send only if this Beijing date has never been claimed"
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-finance-brief
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://wsy-bj.github.io/finance-morning-brief/
    env:
      TZ: Asia/Shanghai
      SITE_URL: https://wsy-bj.github.io/finance-morning-brief/
      RETRY_LIMITED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run content and reader regression tests
        run: |
          python -m compileall -q scripts
          node --check app.js
          python -m unittest discover -s scripts -p "test_*.py" -v

      - name: Check Beijing edition and live site
        id: state
        run: python scripts/prepare_run.py

      - name: Collect public data and generate brief
        if: steps.state.outputs.generate == 'true'
        run: python scripts/generate_report.py

      - name: Validate today's content and privacy boundary
        run: python scripts/validate_report.py

      - name: Save latest and historical briefs
        if: steps.state.outputs.generate == 'true'
        run: |
          git add report.json archive/
          if ! git diff --cached --quiet; then
            git commit -m "Daily brief ${{ steps.state.outputs.date }}"
            git push
          fi

      - name: Prepare public site artifact
        if: steps.state.outputs.deploy == 'true'
        run: |
          mkdir -p dist/archive
          cp index.html app.js style.css history.css report.json .nojekyll dist/
          cp archive/*.json dist/archive/
          if test -d preview; then mkdir -p dist/preview && cp preview/*.json dist/preview/; fi

      - name: Configure GitHub Pages
        if: steps.state.outputs.deploy == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.state.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy GitHub Pages
        if: steps.state.outputs.deploy == 'true'
        uses: actions/deploy-pages@v4

      - name: Verify today's live HTTPS report
        env:
          EXPECTED_DATE: ${{ steps.state.outputs.date }}
        run: python scripts/verify_live.py


  notify:
    name: Deliver daily message even when publication fails
    needs: publish
    if: ${{ always() && (github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.send_notification)) }}
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
      SITE_URL: https://wsy-bj.github.io/finance-morning-brief/
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure delivery identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Send normal, limited or outage daily message
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: python scripts/daily_delivery.py
# 2026-10-29 08:17 CST: recovery trigger after missing morning scheduled runs; workflow logic unchanged.

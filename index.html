<!doctype html>
<html lang="zh-CN">
<head>

  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; connect-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; base-uri 'none'; object-src 'none'; form-action 'none'; upgrade-insecure-requests">

<body>
<div class="shell">

    <div class="brand"><span class="brand-mark">M.</span><span>MARKET / BRIEF</span></div>

  </main>

    <div class="progress"><div id="progress-label">01 / 06</div><div class="progress-track"><span id="progress-fill"></span></div></div>

  </footer>
</div>
<noscript><div class="noscript">请开启 JavaScript 后阅读此晨报。本站不需要登录或第三方脚本。</div></noscript>
